<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение VPN сервисов - Результаты тестирования</title>
    <meta name="description" content="Сравнение скорости VPN сервисов: скачивание и загрузка данных">
    <meta property="og:title" content="VPNS - Сравнение VPN сервисов">
    <meta property="og:type" content="website">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>🚀 VPNS</h1>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="filter-row">
                <div class="search-container">
                    <input 
                        type="text" 
                        id="search" 
                        placeholder="🔍 Поиск по названию сервиса..."
                        autocomplete="off"
                    >
                </div>

                <div class="filter-container">
                    <div class="filter-header">
                        <span class="filter-title">🎛️ Фильтры</span>
                        <div class="filter-actions">
                            <button id="toggle-filter-btn" class="toggle-filter-btn" title="Скрыть/показать фильтры">
                                <span class="toggle-icon">▼</span>
                            </button>
                            <button id="reset-filters-btn" class="reset-filters-btn">Сбросить</button>
                        </div>
                    </div>
                    
                    <div id="filter-content" class="filter-content">
                    
                    <!-- Rating Filter -->
                    <div class="range-filter rating-filter">
                        <div class="range-label">
                            <span class="range-name">
                                <span class="rating-stars-filter">⭐</span> Рейтинг
                            </span>
                            <span class="range-value" id="rating-value">0+</span>
                        </div>
                        <input type="range" id="rating-filter" class="range-slider" min="0" max="5" step="0.1" value="0">
                    </div>
                    
                    <!-- Download Filter -->
                    <div class="range-filter">
                        <div class="range-label">
                            <span class="range-name">↓ Скачивание (Mbps)</span>
                            <span class="range-value" id="download-value">0+</span>
                        </div>
                        <input type="range" id="download-filter" class="range-slider" min="0" max="100" step="1" value="0">
                    </div>
                    
                    <!-- Upload Filter -->
                    <div class="range-filter">
                        <div class="range-label">
                            <span class="range-name">↑ Загрузка (Mbps)</span>
                            <span class="range-value" id="upload-value">0+</span>
                        </div>
                        <input type="range" id="upload-filter" class="range-slider" min="0" max="100" step="1" value="0">
                    </div>
                    </div>
                </div>
            </div>

            <div class="sort-container">
                <span class="sort-label">Сортировать по:</span>
                <div class="sort-buttons">
                    <button data-sort="download" class="sort-btn sortable">
                        <span class="th-content">
                            Скачивание
                            <span class="sort-icon">↕</span>
                        </span>
                    </button>
                    <button data-sort="rating" class="sort-btn sortable">
                        <span class="th-content">
                            Рейтинг
                            <span class="sort-icon">↕</span>
                        </span>
                    </button>
                    <button data-sort="upload" class="sort-btn sortable">
                        <span class="th-content">
                            Загрузка
                            <span class="sort-icon">↕</span>
                        </span>
                    </button>
                    <button id="show-all-btn" class="sort-btn">
                        <span class="th-content">
                            Показать все
                        </span>
                    </button>
                </div>
            </div>

            <div class="cards-container" id="cards-container">
                <!-- Карточки загрузятся через JavaScript -->
            </div>

            <div class="legend">
                <h3>📊 Легенда скорости</h3>
                <div class="legend-items">
                    <div class="legend-item">
                        <span class="speed-dot high"></span>
                        <span>Быстро (>10 Mbps)</span>
                    </div>
                    <div class="legend-item">
                        <span class="speed-dot medium"></span>
                        <span>Средне (5-10 Mbps)</span>
                    </div>
                    <div class="legend-item">
                        <span class="speed-dot low"></span>
                        <span>Медленно (<5 Mbps)</span>
                    </div>
                </div>
            </div>

            <footer class="footer">
                <div class="footer-content">
                    <span id="last-updated">📅 Обновлено: Февраль 2025</span>
                </div>
            </footer>


        </div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
