<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение VPN сервисов - Результаты тестирования</title>
    <meta name="description" content="Сравнение скорости VPN сервисов: скачивание и загрузка данных">
    <meta property="og:title" content="VPNS - Сравнение VPN сервисов">
    <meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<script>
// Ранняя установка темы, чтобы не было вспышки неправильной темы
(function () {
    try {
        var m = localStorage.getItem('theme');
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = m === 'light' || (m !== 'dark' && light) ? 'light' : 'dark';
    } catch (e) { /* без localStorage остаётся тёмная */ }
})();
</script>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <h1>🚀 VPNS</h1>
            <button id="theme-toggle" class="theme-toggle" type="button"></button>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="filter-row">
                <div class="search-container">
                    <input 
                        type="text" 
                        id="search" 
                        placeholder="🔍 Поиск по названию сервиса..."
                        autocomplete="off"
                    >
                </div>

                <div class="filter-container">
                    <div id="filter-content" class="filter-content">
                        <span class="range-name">
                            <span class="rating-stars-filter">⭐</span> Рейтинг от
                        </span>
                        <input type="number" id="rating-value" class="range-value" min="0" max="5" step="0.1" inputmode="decimal" value="0">
                        <input type="range" id="rating-filter" class="range-slider" min="0" max="5" step="0.1" value="0">
                        <button id="reset-filters-btn" class="reset-filters-btn">Сбросить</button>
                    </div>
                </div>
            </div>

            <div class="sort-container">
                <span class="sort-label">Сортировать по:</span>
                <div class="sort-buttons">
                    <button data-sort="rating" class="sort-btn sortable">
                        <span class="th-content">
                            Рейтинг
                            <span class="sort-icon">↕</span>
                        </span>
                    </button>
                    <button data-sort="name" class="sort-btn sortable">
                        <span class="th-content">
                            Название
                            <span class="sort-icon">↕</span>
                        </span>
                    </button>
                    <button id="show-all-btn" class="sort-btn">
                        <span class="th-content">
                            Показать все
                        </span>
                    </button>
                </div>
            </div>

            <div class="cards-container" id="cards-container">
                <!-- Карточки загрузятся через JavaScript -->
            </div>

            <footer class="footer">
                <div class="footer-content">
                    <span id="last-updated">📅 Обновлено: Февраль 2025</span>
                </div>
            </footer>


        </div>
    </main>

    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
