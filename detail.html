<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">VPN Speed Test</title>
    <meta name="description" content="Подробная информация о VPN сервисе">
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<script>
(function () {
    try {
        var m = localStorage.getItem('theme');
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = m === 'light' || (m !== 'dark' && light) ? 'light' : 'dark';
    } catch (e) { /* без localStorage остаётся тёмная */ }
})();
</script>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="back-link">← Назад к списку</a>
            <button id="theme-toggle" class="theme-toggle" type="button"></button>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="detail-card" id="vpn-content">
                <!-- Контент загрузится через JavaScript -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p id="footer-date">📅 Данные: Февраль 2025</p>
        </div>
    </footer>

    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/utils-shared.js"></script>
    <script type="module" src="vpn-detail.js"></script>
</body>
</html>
